name = "workout-tracker-push-relay"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# One Durable Object per scheduled push: it keeps {subscription, fireAt} and an alarm, nothing else.
[[durable_objects.bindings]]
name = "TIMERS"
class_name = "PushTimer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushTimer"]

# Per-IP rate limit (free). 20 requests per minute is far above one person's rest timers.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
# Set to your app's origin (scheme + host, no path), e.g. https://<you>.github.io
ALLOWED_ORIGIN = "https://CHANGE-ME.github.io"
# Contact for push services (VAPID "sub" claim): mailto: or https: URL.
VAPID_SUBJECT = "mailto:CHANGE-ME@example.com"
# Secrets (never in this file): VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY, see README.md.
